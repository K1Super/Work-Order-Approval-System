# ============================================================
# 安全扫描 GitHub Actions 工作流 — 工单审批流转系统
# 触发：push/PR 到 main/master 分支，或每周一凌晨定时扫描
# 包含：依赖漏洞扫描、代码静态分析、密钥泄露检测
# ============================================================

name: Security Scan

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]
  schedule:
    # 每周一凌晨 3 点（UTC）定时全量扫描
    - cron: '0 3 * * 1'
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read
  security-events: write  # 允许上传 SARIF 结果到 GitHub Security

jobs:
  # ============================================================
  # 后端依赖漏洞扫描（Maven）
  # ============================================================
  backend-dependency-scan:
    name: Backend Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: Maven 依赖树
        working-directory: backend
        run: mvn dependency:tree -DoutputFile=deps.txt -q

      - name: OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: 'work-order-approval-system'
          path: 'backend'
          format: 'HTML,JSON,SARIF'
          args: >
            --enableRetired
            --failOnCVSS 7

      - name: 上传扫描结果
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: dependency-check-report
          path: reports/

      - name: 上传 SARIF 到 GitHub Security
        uses: github/codeql-action/upload-sarif@v3
        if: always()
        with:
          sarif_file: reports/dependency-check-report.sarif

  # ============================================================
  # 前端依赖漏洞扫描（npm audit）
  # ============================================================
  frontend-dependency-scan:
    name: Frontend Dependency Scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      - name: npm audit（高危漏洞检测）
        working-directory: frontend
        run: |
          npm audit --audit-level=high --omit=dev || {
            echo "::warning::发现高危漏洞，请运行 npm audit fix 修复"
            exit 1
          }

  # ============================================================
  # 代码静态分析（CodeQL）
  # ============================================================
  codeql-analysis:
    name: CodeQL Static Analysis
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['java', 'javascript']
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: ${{ matrix.language }}
          # 使用默认的安全查询包
          queries: security-extended

      - name: Setup JDK 17（Java 构建）
        if: matrix.language == 'java'
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      - name: 构建后端（Java）
        if: matrix.language == 'java'
        working-directory: backend
        run: mvn -B compile -DskipTests

      - name: 执行 CodeQL 分析
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:${{ matrix.language }}"

  # ============================================================
  # 密钥泄露检测（gitleaks）
  # ============================================================
  secret-scanning:
    name: Secret Scanning
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # 完整历史，扫描所有提交

      - name: gitleaks 密钥扫描
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_ENABLE_COMMENTS: true
          GITLEAKS_ENABLE_UPLOAD_ARTIFACT: true
          GITLEAKS_CONFIG: .gitleaks.toml
