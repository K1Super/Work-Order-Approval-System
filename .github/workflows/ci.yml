# ============================================================
# CI 持续集成工作流 — 工单审批流转系统
# 触发：push/PR 到 main/master 分支，或手动触发
# 后端：build（编译）→ test（单测 + 集成）→ lint（checkstyle 硬门禁）→ package（打包）
# 前端：npm ci + npm run build（构建作为本轮门禁）
# 说明：安全扫描（OWASP + CodeQL + gitleaks + npm audit）由独立工作流
#       .github/workflows/security-scan.yml 负责，与本流水线并行执行。
# ============================================================

name: CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:  # 支持手动触发

permissions:
  contents: read

jobs:
  # ============================================================
  # 后端：build → test → lint → package 四段
  # 四段合并于单条 `mvn verify -Pit` 完成：
  #   - validate 阶段：checkstyle 硬门禁（lint，含测试源码）
  #   - compile 阶段：源码编译（build）
  #   - test 阶段：surefire 单元测试（test）
  #   - integration-test/verify 阶段：failsafe 集成测试（test）
  #   - package 阶段：spring-boot repackage 产出可执行 jar（package）
  # ============================================================
  backend:
    name: 后端 CI（build → test → lint → package）
    runs-on: ubuntu-latest

    services:
      # 集成测试数据库：官方 postgres:14 镜像
      # services 无 Docker 客户端限制，直接端口映射到 host 127.0.0.1
      postgres:
        image: postgres:14
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      # 集成测试缓存：官方 redis:7 镜像
      # 官方镜像已内置 `redis-cli ping` 健康检查，此处显式声明保持兼容
      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup JDK 17（Temurin）
        uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'maven'

      # 单条命令同时完成四段：
      #   build = mvn compile；lint = validate 阶段 checkstyle（含测试源码）
      #   test = surefire 单测（test 阶段）+ failsafe 集成测试（verify 阶段）
      #   package = spring-boot repackage（package 阶段）
      # -Ddependency-check.skip=true 跳过 OWASP 依赖扫描（安全扫描由 security-scan.yml 单独负责）。
      - name: 编译 + 单测 + Lint + 集成测试 + 打包
        working-directory: backend
        run: |
          mvn -B verify -Pit \
            "-Ddependency-check.skip=true" \
            -Dit.db.host=127.0.0.1 \
            -Dit.db.port=5432 \
            -Dit.db.user=postgres \
            -Dit.db.password=postgres \
            -Dit.redis.host=127.0.0.1 \
            -Dit.redis.port=6379

      - name: 上传后端 jar 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: work-order-system-jar
          path: backend/target/work-order-system-2.8.2.jar

  # ============================================================
  # 前端：npm ci → npm run lint（ESLint 硬门禁）→ npm run build
  # lint 门禁说明见 docs/coding-standards.md「5. 测试与 CI 门禁」。
  # ============================================================
  frontend:
    name: 前端 CI（npm ci → lint → build）
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Setup Node.js 20
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: 安装依赖
        working-directory: frontend
        run: npm ci

      # ESLint 硬门禁（2026-09-19 落地，详见 docs/coding-standards.md）
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: 构建
        working-directory: frontend
        run: npm run build

      - name: 上传前端 dist 产物
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: frontend-dist
          path: frontend/dist