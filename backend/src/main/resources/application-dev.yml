# ============================================================
# 工单审批流转系统 - 开发环境配置
# 激活方式: --spring.profiles.active=dev 或设置 SPRING_PROFILES_ACTIVE=dev
# 密钥采用 ${ENV_VAR:default} 模式 — 环境变量优先，本地开发有默认值便于启动
# 生产环境强制使用环境变量（见 application-prod.yml，无默认值）
# ============================================================

spring:
  # 数据源配置 - 开发环境（本地数据库）
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:work_order_system}?stringtype=unspecified
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:666666}

  # Redis配置 - 开发环境（本地Redis）
  redis:
    host: ${REDIS_HOST:localhost}
    port: ${REDIS_PORT:6379}
    password: ${REDIS_PASSWORD:}
    database: 0

  # 开发模式：显示详细SQL日志
  jpa:
    show-sql: true
    hibernate:
      ddl-auto: none

  # 开发环境热部署
  devtools:
    restart:
      enabled: true

# JWT配置 - 开发环境（Token有效期更长）
# W-07 轮换：2026-09-16 替换泄露的旧默认密钥（随机 32 字节 Base64），生产必须用环境变量 JWT_SECRET
jwt:
  secret: ${JWT_SECRET:bNqr/7JEn/x7Ffqdu9aIH5znT4axAFpOugbhexYeJf8=}
  expiration: ${JWT_EXPIRATION:86400000}  # 24小时
  header: Authorization
  prefix: Bearer

# CORS配置 - 开发环境允许本地前端（精确白名单，禁止通配 *）
cors:
  allowed-origins: ${CORS_ORIGINS:http://localhost:5173,http://localhost:3000}

# 日志配置 - 开发环境（DEBUG级别）
# W-18 修复：移除 logging.pattern.*，pattern/rolling 统一由 logback-spring.xml 管理，避免配置打架
logging:
  level:
    root: INFO
    com.workorder: DEBUG
    org.springframework.security: DEBUG
    org.flowable: WARN
  file:
    name: logs/dev.log

# 服务器配置
server:
  port: ${SERVER_PORT:8080}
  servlet:
    context-path: /api/v1

# MyBatis配置 - 开发环境
mybatis:
  configuration:
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl

# SpringDoc OpenAPI 配置（规范 §1 — API 文档自动生成）
springdoc:
  api-docs:
    enabled: true
    path: /v3/api-docs
  swagger-ui:
    enabled: true
    path: /swagger-ui.html
    tags-sorter: alpha
    operations-sorter: method
  packages-to-scan: com.workorder.controller
  default-produces-media-type: application/json

# ============================================================
# OPTIMIZATION 三.3.2 / 三.3.3 安全配置（dev 环境）
# - KEK：环境变量 KEK_BASE64（32 字节 Base64），未配置时使用固定默认值便于本地启动
# - AES legacy 密钥：用于解密历史数据（迁移期兼容），数据迁移完成后可移除
# - CSRF：由 Spring Security CookieCsrfTokenRepository 接管，前端 Axios 自动注入
# ============================================================
work-order-system:
  security:
    # 修复（2026-07-26）：给固定默认密钥（32 字节 Base64），避免每次重启生成随机密钥
    # 导致旧密文无法解密。密钥内容：dev-aes-key-32bytes-fixed-2026!!
    # 生产环境必须通过环境变量 AES_ENCRYPTION_KEY 注入（见 application-prod.yml）
    aes-encryption-key: ${AES_ENCRYPTION_KEY:ZGV2LWFlcy1rZXktMzJieXRlcy1maXhlZC0yMDI2ISE=}
    # OPTIMIZATION 三.3.3：KEK Base64（32 字节随机数 Base64 编码）
    # dev 环境用环境变量；未配置时使用固定默认 KEK（仅本地测试，禁止用于任何真实环境）
    # 真实值：dev-kek-32bytes-fixed-2026!a@#$ （32 字节，Base64 编码）
    kek-base64: ${KEK_BASE64:ZGV2LWtlay0zMmJ5dGVzLWZpeGVkLTIwMjYhIWEjJSQ=}
    # KEK 来源标记（dev=env；prod 必须 vault 详见 application-prod.yml）
    kek-source: ${KEK_SOURCE:env}
    # DEK 数据迁移开关（迁移完成后可设为 false 加速启动）
    dek-migration:
      enabled: ${DEK_MIGRATION_ENABLED:true}
  db:
    auto-create: true

